<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Podcasted - Web Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#" onclick="showDiscover(); return false;"><img src="https://store-images.s-microsoft.com/image/apps.13925.14487979042694345.5f0e6603-ff5e-49f6-aa11-078dcf2a0cd0.57dddffb-fdf5-42cc-b9bd-84a2468903a6?h=380" alt="Podcasted logo" /><span>Podcasted</span></a>
      <nav aria-label="Main navigation">
        <button id="discoverNav" class="nav-item active" onclick="showDiscover()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>Discover</button>
        <a class="nav-item" target="_blank" rel="noopener noreferrer" href="https://apps.microsoft.com/detail/9nxwgr2b1p26?cid=webplayer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>Download App</a>
      </nav>
    </aside>
    <main class="app-main">
      <header class="topbar">
        <div class="history-controls" aria-label="Page navigation">
          <button id="backButton" type="button" onclick="navigatePage(-1)" aria-label="Back" title="Back" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12H4m7-7-7 7 7 7"/></svg></button>
          <button id="forwardButton" type="button" onclick="navigatePage(1)" aria-label="Forward" title="Forward" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></button>
        </div>
        <form class="unified-search" onsubmit="handleSearchSubmit(event)" role="search">
          <input type="text" id="searchInput" aria-label="Search podcasts or enter RSS URL" placeholder="Search or enter RSS URL" autocomplete="off" />
          <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></button>
        </form>
      </header>
      <section id="searchDiv" aria-labelledby="browseTitle">
        <div class="section-heading"><div><p class="eyebrow" id="browseEyebrow">DISCOVER PODCASTS</p><h1 id="browseTitle">Discover</h1></div><button class="text-button" id="retryBrowse" onclick="showDiscover()" hidden>Try again</button></div>
        <p id="searchStatus" class="search-status" role="status" hidden></p>
        <div id="browseLoading" class="podcast-grid loading-skeleton" aria-hidden="true" hidden></div>
        <div id="searchEmptyState" class="search-empty-state"><svg class="discover-illustration" viewBox="0 0 180 140" fill="none" aria-hidden="true"><circle cx="90" cy="70" r="60" fill="currentColor" opacity="0.06"/><rect x="72" y="28" width="36" height="56" rx="18" stroke="currentColor" stroke-width="3"/><path d="M58 65v8a32 32 0 0 0 64 0v-8M90 105v18M75 123h30M42 54v24M30 61v10M138 54v24M150 61v10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><h2>Find your next favorite podcast</h2><p>Use the search box above to find a podcast by name or topic, or paste an RSS URL to start listening.</p></div>
        <ul id="searchResults" class="podcast-grid" hidden></ul>
      </section>
      <section id="podcastDetail" hidden>
        <div id="feedLoading" class="loading-skeleton" aria-hidden="true" hidden></div>
        <div id="podcastInfo" class="podcast-info" style="display: none"><div class="cover-frame"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><rect x="24" y="10" width="16" height="30" rx="8"/><path d="M16 30v3a16 16 0 0 0 32 0v-3M32 49v9M23 58h18" stroke-linecap="round"/></svg><img id="podcastCover" class="cover" alt="Podcast cover" hidden /></div><div class="meta"><h1 id="podcastTitle"></h1><p id="podcastAuthor"></p><p id="podcastDesc"></p></div></div>
        <p id="feedStatus" role="status" hidden></p>
        <ul id="episodeList"></ul>
      </section>
    </main>

    <section class="audio-player" aria-label="Podcast player">
      <audio id="player" preload="metadata"></audio>
      <div class="player-artwork" aria-hidden="true"><span>♫</span><img id="playerCover" alt="" hidden /></div>
      <div class="transport-controls">
        <button type="button" onclick="seekBackward()" aria-label="Back 15 seconds" title="Back 15 seconds" class="skip-button"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 12a18 18 0 1 1-7 14M13 5v12H2" /></svg><span>15</span></button>
        <button type="button" id="playPauseButton" onclick="togglePlayback()" aria-label="Play" title="Play" disabled><svg viewBox="0 0 48 48" aria-hidden="true"><path id="playPauseIcon" d="M14 6 42 24 14 42Z" /></svg></button>
        <button type="button" onclick="seekForward()" aria-label="Forward 30 seconds" title="Forward 30 seconds" class="skip-button"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M35 12a18 18 0 1 0 7 14M35 5v12h11" /></svg><span>30</span></button>
      </div>
      <div class="player-main">
        <p id="currentEpisodeTitle">Choose an episode to start listening</p>
        <p id="playerSubtitle">Podcasted</p>
        <input id="playbackProgress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Playback position" disabled />
        <div class="player-times"><span id="elapsedTime">00:00</span><span id="remainingTime">-00:00</span></div>
        <p id="playerStatus" role="status" hidden></p>
      </div>
      <div class="player-options">
        <select id="playbackRate" aria-label="Playback speed" title="Playback speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        <button type="button" id="muteButton" aria-label="Mute" title="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3Z" /><path id="volumeWaves" d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg></button>
        <input id="volumeControl" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
